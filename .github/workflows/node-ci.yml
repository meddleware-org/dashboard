name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # The npm bundled with Node 24.13 (11.6.2) cannot verify the attestations of recently published packages
      # (EMISSINGSIGNATUREKEY); the release workflow pins the same client.
      - name: Upgrade npm
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: node .github/audit-gate.mjs

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js

      - name: Lint HTML (html-validate)
        run: npm run lint:html

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: No inline script in the built pages (the CSP refuses it)
        run: npm run check:dist

      - name: Third-party licence notices
        run: npm run check:licenses && test -s dist/THIRD_PARTY_LICENSES

      # Every route and every embedded tool mounts in a real browser, with no network.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (routes and tool tabs)
        run: npm run test:e2e

  image:
    name: Image (build and probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not pushed. Builds the Dockerfile as the release does (the inline-script check included) and runs the
      # container the way the cluster does: non-root user, read-only root, no capabilities.
      - name: Build (not pushed)
        run: docker build --tag dashboard:ci .
      - name: Probe the container (user, /, headers, SPA fallback, bundle, licences)
        run: bash scripts/smoke.sh dashboard:ci

  scan:
    name: Filesystem and configuration scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (vulnerabilities, Dockerfile misconfiguration, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0
